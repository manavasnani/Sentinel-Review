# .github/workflows/sentinel-review.yml
#
# Add this to your repository to enable AI-powered security review
# on every pull request.

name: Sentinel Security Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - name: Sentinel Review
        uses: manavasnani/Sentinel-Review@v0.2.0
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: fail the check on high+ severity findings
          # fail_on: high